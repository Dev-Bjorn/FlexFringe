[default]
mode=mcts
active-heuristics=mcts-edsm, greedy-edsm

[mcts]
valuation-policy=interpolate(0.5, model-size, rollout-length)
selection-policy=lcb1
max-rollout-steps=-1
convergence-policies=node-termination,score-improvement
max-no-improvement=2500
force-until-terminal=0
rollout-action-policy=weighted
rollout-weighted-extend-scoring=min
rollout-action-seed=60
expansion-action-policy=greedy
store-rollouts=1
expansion-action-seed=42
selection-search-policy=best-child-vs-parent
auto-expand-one-child=1
use-finisher=0

mcts-heuristic=mcts-edsm
comparison-heuristic=greedy-edsm

[heuristic]
name = greedy-edsm
heuristic-name = evidence_driven
data-name = edsm_data
sinkson = 0
sinkcount = 10
state_count = 0
symbol_count = 0
lowerbound = 0
printwhite = 0
extend = 0
largestblue = 1

[heuristic]
name = mcts-edsm
heuristic-name = evidence_driven
data-name = edsm_data
random = 0.5
sinkson = 0
sinkcount = 10
state_count = 0
symbol_count = 0
lowerbound = 0
extend=0
; Used for the property that all extends will be searched
extendsinks=1
; Used such that the property only largest blue is checked is turned off, so it returns all information, to be
; able to generate sub trees
largestblue = 0
blueblue=0
redfixed=0
allfixed=0


